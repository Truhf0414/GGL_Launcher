name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: UI/CSS rules
        run: npm run check:ui-css

      - name: Syntax (core scripts)
        run: |
          node -c main.js
          node -c preload.js
          node -c renderer.js
          node -c lib/settings-logic.js
          node -c lib/manifest-fields.js
          node -c lib/manifest-url-configured.js
          node -c lib/manifest-file-url.js
          node -c lib/paths-layout.js
          node -c lib/notifications-broadcast.js
          node -c lib/launcher-debug-logging.js
          node -c main/minecraft-version-json.js
          node -c main/net-fetch.js
          node -c main/mc-mirror.js
          node -c main/manifest-sync.js
          node -c main/server-status.js

      - name: Unit tests
        run: npm test
