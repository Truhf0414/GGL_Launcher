name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: UI/CSS rules
        run: npm run check:ui-css

      - name: IPC docs index is up-to-date
        run: |
          npm run docs:ipc
          git diff --exit-code ARCHITECTURE.md

      - name: Lint (also catches syntax errors in every file)
        run: npm run lint

      - name: Unit tests
        run: npm test
